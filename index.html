<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="img/logo.png" />
    <title>My Best PC</title>
  </head>
  <body>
    <header>
      <figure>
        <img id="settings" src="img/settings.png" alt="Configurações" />
      </figure>

      <div class="nome">
        <h1>My PC</h1>
        <figure>
          <img src="img/logo.png" alt="My pc logo" />
        </figure>
      </div>

      <div class="options">
        <figure>
          <img src="img/more.png" alt="Mais" />
          <img src="img/save.png" alt="Salvar" />
          <img src="img/share.png" alt="Compartilhar" />
        </figure>
      </div>
    </header>

    <nav>
      <div class="login">
        <button
          onclick="window.location.href = 'front/cadastrar.html'"
          id="novo"
        >
          <img src="img/avatar.png" alt="Login" />
        </button>
      </div>

      <div class="pesquisa">
        <select>
          <option selected>Relevância</option>
          <option>Menor preço</option>
          <option>Maior preço</option>
          <option>Nome A-Z</option>
        </select>
        <input type="text" placeholder="Digite o nome do componente..." />
        <button>
          <img src="img/search.png" alt="Pesquisar" />
        </button>
      </div>

      <div class="valor">
        <p>R$0000,00</p>
      </div>
    </nav>

    <div class="container">
      <aside id="carrinho">
        <!--
        <div class="card-produto">
          <div>
            <p>1x I5 14000f</p>
            <span>R$200,00</span>
          </div>
          <img src="img/logo.png" alt="I5 14000f" />
        </div>

        <div class="card-produto">
          <div>
            <p>1x I5 14000f</p>
            <span>R$200,00</span>
          </div>
          <img src="img/logo.png" alt="I5 14000f" />
        </div>
        -->
        
      </aside>

      <main>
        <div class="produtos-grid"></div>
      </main>

    <script src="index.js"></script>
  </body>
</html>
